services:
  - type: web
    runtime: python
    name: classmind-iqoo-hack-api-sanjais12a
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: AI_PROVIDER
        value: auto
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://classmind-iqoo-hack-sanjais12a.onrender.com

  - type: web
    runtime: static
    name: classmind-iqoo-hack-sanjais12a
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://classmind-iqoo-hack-api-sanjais12a.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
